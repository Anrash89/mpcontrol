:root {
  color-scheme: light;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Manrope", var(--sans);
  --ink: #20223a;
  --muted: #5b6279;
  --accent: #5947a7;
  --accent-dark: #493985;
  --line: #37315717;
  --rim: #ffffffe8;
  --glass: #ffffffa6;
  --sheet: #ffffffd1;
  --shadow: inset 0 1px 0 #fff, 0 12px 34px #362d6210, 0 2px 7px #362d6207;
  --focus: #6f59c7;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font: 14px/1.45 var(--sans);
  color: var(--ink);
  background: #f3f2f9;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 300px; min-height: 100vh; }
body::before {
  content: ""; position: fixed; z-index: -1; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 12% 20%, #e7e1f9, transparent 45%),
    radial-gradient(ellipse at 89% 13%, #e2edff, transparent 45%),
    radial-gradient(ellipse at 92% 80%, #f6dff3, transparent 48%),
    radial-gradient(ellipse at 20% 100%, #e9eeff, transparent 48%),
    #f6f5fb;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .62; cursor: wait; }
button, input, select, textarea, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
a { color: var(--market-strong, var(--accent-dark)); }
svg { flex-shrink: 0; vertical-align: middle; }
h1, h2, h3, p, dl, dd { margin: 0; }
h1, h2, h3, .brand, .market-name > strong { font-family: var(--display); }
h1 { font-size: clamp(32px, 4vw, 49px); font-weight: 800; letter-spacing: -.062em; line-height: 1.1; overflow-wrap: anywhere; }
h2 { font-size: 20px; line-height: 1.25; font-weight: 800; letter-spacing: -.035em; }
h3 { font-size: 15px; line-height: 1.35; font-weight: 800; letter-spacing: -.015em; }
[hidden] { display: none !important; }
.skip { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 10px; background: #fff; transform: translateY(-150%); }
.skip:focus { transform: none; }
.loading { padding: 38px 20px; text-align: center; color: var(--muted); }

[data-market="ozon"], .market-tag.ozon, .chip.ozon {
  --market-strong: #235ba6; --market-ink: #244776; --market-rgb: 61 124 222;
  --market-light: #e6f0ff; --market-pale: #f2f7ff; --market-rim: #c4d9f7;
}
[data-market="wb"], .market-tag.wb, .chip.wb {
  --market-strong: #8b3b86; --market-ink: #713169; --market-rgb: 167 79 165;
  --market-light: #f6e3f5; --market-pale: #fcf1fa; --market-rim: #e8c9e7;
}
[data-market="mixed"] {
  --market-strong: #6351a4; --market-rgb: 125 106 187;
  --market-light: #eee8fa; --market-pale: #f7f3fc; --market-rim: #ded3f3;
}

.sidebar, .topbar, .panel, .stat, .market-card, .bottom-nav {
  border: 1px solid var(--rim);
  background: var(--glass);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  backdrop-filter: blur(20px) saturate(145%);
}
.sidebar {
  position: fixed; z-index: 3; inset: 18px auto 18px 18px; width: 228px;
  display: flex; flex-direction: column; padding: 18px 13px 12px; border-radius: 25px; overflow-y: auto;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px; min-width: 0; padding: 0; border: 0;
  background: transparent; text-align: left; font-size: 23px; font-weight: 800;
  line-height: 1; letter-spacing: -.055em; white-space: nowrap;
}
.brand img { display: block; flex-shrink: 0; filter: drop-shadow(0 4px 7px #6351b040); }
.brand small, .account small { display: block; margin-top: 5px; color: var(--muted); font: 500 10px/1.2 var(--sans); letter-spacing: 0; }
.sidebar .brand { margin: 5px 0 28px 7px; align-self: flex-start; }
.side-nav, .modal-nav { display: grid; gap: 4px; }
.nav-item {

.market-tag, .status { display: inline-flex; align-items: center; gap: 4px; width: fit-content; padding: 4px 6px; border-radius: 7px; background: #efedf6; color: #544d70; font-size: 10px; font-weight: 700; line-height: 1.1; white-space: nowrap; }

}

}

.search, .select-filter {

dialog {

}

.dialog-head {

  gap: 10px; padding: 13px 16px; border-bottom: 1px solid #ffffffc9;

.field { color: #515570; font-size: 12px; font-weight: 650; }

}

.form-error, .dialog-notice { color: #8b3b37; font-size: 13px; }
.dialog-actions, .dialog-toolbar, .detail-badges, .links { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.dialog-actions { justify-content: flex-end; }
.dialog-toolbar { margin: 8px 0; }
.details { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 9px 0; }
.detail, .product-platform {

  background: var(--market-pale, #f6f2fc);
}

.product-platforms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }

.inline-link { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
.subsection { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }

.files, .timeline { list-style: none; margin: 6px 0 0; padding: 0; }

.stock-reminder {

.subsection .links + .button, .subsection .subtle + .button { margin-top: 6px; }
.toast { position: fixed; z-index: 5; right: 14px; bottom: 14px; max-width: calc(100% - 28px); padding: 9px 12px; border: 1px solid #ffffff66; border-radius: 11px; color: #fff; background: #514282f0; box-shadow: var(--shadow); font-size: 13px; }

  </style>

<body>
  <div id="app"><div class="loading">Открываем рабочее пространство…</div></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Для работы сайта включите JavaScript.</noscript>
<script>
"use strict";

const markets = {ozon: "Ozon", wb: "Wildberries"};
const categories = {content: "Карточки", supply: "Поставки", ads: "Продвижение", price: "Цены", report: "Отчётность", other: "Другое"};
const statuses = {
  incoming: "На согласовании", clarify: "На уточнении", todo: "К выполнению",
  doing: "В работе", review: "На проверке", rework: "На доработке", done: "Принято",
};
const priorities = {high: "Высокий", normal: "Обычный", low: "Низкий"};
const requestStatus = (status) => status === "incoming" || status === "clarify";
const taskActive = (task) => !task.archived && task.status !== "done";
const role = (user) => user.role === "lead" ? "Руководитель" : user.job || "Сотрудник";
const launchTemplate = [
  {key: "content", label: "Подготовить фото и инфографику", offset: -7, category: "content", job: "Дизайнер"},
  {key: "listing", label: "Подготовить карточку товара", offset: -4, category: "content", job: "Менеджер"},
  {key: "price", label: "Проверить цену и условия акции", offset: -2, category: "price", job: "Менеджер"},
  {key: "stock", label: "Подтвердить приёмку и остатки", offset: 0, category: "supply", job: "Логист"},
  {key: "promo", label: "Подготовить продвижение", offset: 1, category: "ads", job: "Менеджер"},
  {key: "start", label: "Запустить продажи", offset: 2, category: "other", job: "Координатор"},
];
const screenshotTypes = { "image/png": true, "image/jpeg": true, "image/webp": true };
const recurringTypes = {daily: "Каждый день", weekdays: "По будням", weekly: "Раз в неделю"};
const approvalTypes = {cover: "Обложка и офферы", price: "Стартовая цена", budget: "Бюджет на блогеров"};
const approvalStatuses = {pending: "На согласовании", approved: "Согласовано"};

const dateKey = (date = new Date(), timeZone) => {
  if (!timeZone) return [date.getFullYear(), date.getMonth() + 1, date.getDate()].map((x) => String(x).padStart(2, "0")).join("-");
  const parts = new Intl.DateTimeFormat("en", {timeZone, year: "numeric", month: "2-digit", day: "2-digit"}).formatToParts(date);
  const map = Object.fromEntries(parts.map(({type, value}) => [type, value]));
  return [map.year, map.month, map.day].join("-");
};

function shiftDate(key, delta) {
  const date = new Date(key + "T12:00:00Z");
  date.setUTCDate(date.getUTCDate() + delta);
  return date.toISOString().slice(0, 10);
}

function formatDate(key, options = {day: "numeric", month: "short"}) {
  return key ? new Date(key + "T12:00:00Z").toLocaleDateString("ru-RU", {...options, timeZone: "UTC"}).replace(/\.$/, "") : "—";
}

function taskMonth(task) {
  return (task.due || (task.createdAt ? dateKey(new Date(task.createdAt)) : "")).slice(0, 7);
}

const emptyState = () => ({tasks: [], products: [], launches: [], operations: [], schedules: [], revision: 0});
const person = (users, id) => users.find((user) => user.id === id)?.name || "—";
const taskOrder = (a, b) => (a.due || "9999").localeCompare(b.due || "9999") ||
  Object.keys(priorities).indexOf(a.priority) - Object.keys(priorities).indexOf(b.priority) || b.updatedAt - a.updatedAt;

function taskActions(task, user) {
  if (task.archived) return user.role === "lead" || user.id === task.authorId ? ["restore"] : [];
  const lead = user.role === "lead";
  const author = task.authorId === user.id;
  const worker = task.assigneeId === user.id;
  const actions = [];
  if (lead && task.status === "incoming") actions.push("approve", "clarify");
  if (author && task.status === "clarify") actions.push("resubmit");
  if (worker && ["todo", "rework"].includes(task.status)) actions.push("start");
  if (worker && ["todo", "doing", "rework"].includes(task.status)) {
    if (task.stockCheck) actions.push("verifyStock");
    else if (task.kind === "task") actions.push("complete", "submit");
    else actions.push("submit");
  }
  if ((worker || lead) && task.kind === "task" && !task.stockCheck && task.status === "done") actions.push("undoComplete");
  if (author && task.status === "review") actions.push("accept", "rework");
  if (lead || author) actions.push("archive");
  return actions;
}

const transitions = {
  approve: {label: "Утвердить и назначить", status: "todo"},
  clarify: {label: "Запросить уточнение", status: "clarify", comment: true},
  resubmit: {label: "Отправить уточнение", status: "incoming"},
  start: {label: "Взять в работу", status: "doing"},
  complete: {label: "Отметить выполненной", status: "done"},
  undoComplete: {label: "Вернуть к выполнению", status: "todo"},
  verifyStock: {label: "Подтвердить проверку", status: "done"},
  submit: {label: "Отправить на проверку", status: "review", result: true},
  accept: {label: "Принять работу", status: "done"},
  rework: {label: "Вернуть на доработку", status: "rework", comment: true},
  archive: {label: "В архив"},
  restore: {label: "Восстановить"},
};

function overview(state, today) {
  const live = state.tasks.filter(taskActive);
  const conflicts = new Map();
  for (const task of live) {
    if (requestStatus(task.status) || task.status === "review" || !task.assigneeId || !task.due) continue;
    const key = task.assigneeId + "|" + task.due;
    if (!conflicts.has(key)) conflicts.set(key, []);
    conflicts.get(key).push(task);
  }
  return {
    requests: live.filter((task) => requestStatus(task.status)),
    reviews: live.filter((task) => task.status === "review"),
    late: live.filter((task) => task.due && task.due < today),
    conflicts: [...conflicts.values()].filter((group) => group.length > 1).flat(),
    launches: state.launches.filter((launch) => launchRisks(launch, state.tasks, state.operations, today).length),
  };
}

function launchRisks(launch, tasks, operations, today) {
  const stages = tasks.filter((task) => task.launchId === launch.id && taskActive(task));
  const supplies = operations.filter((row) => row.type === "supply" && row.launchId === launch.id);
  const risks = [];
  if (stages.some((task) => task.due && task.due < today)) risks.push("Есть просроченные этапы");
  if (launch.start && stages.some((task) => task.due > launch.start)) risks.push("Срок этапа позже старта");
  if (supplies.some((row) => !row.actualIn && row.plannedIn && row.plannedIn < today)) risks.push("Поставка задерживается");
  if (launch.start && supplies.some((row) => (row.actualIn || row.plannedIn) > launch.start)) risks.push("Приёмка позже старта");
  if (launch.start && launch.start <= shiftDate(today, 3) && Object.keys(approvalTypes).some((key) => launch.approvals[key] !== "approved")) risks.push("Остались согласования к старту");
  return risks;
}

class DomainError extends Error {
  constructor(message, status = 400) { super(message); this.status = status; }
}
const check = (condition, message, status) => { if (!condition) throw new DomainError(message, status); };
const text = (value, max, label, required = false) => {
  const result = typeof value === "string" ? value.trim() : "";
  check(result.length <= max && (!required || result), "Проверьте поле «" + label + "»");
  return result;
};
const option = (value, options, label) => {
  check(typeof value === "string" && Object.hasOwn(options, value), "Выберите " + label);
  return value;
};
const date = (value, required = false) => {
  if (!value && !required) return "";
  check(typeof value === "string" && /^[1-9]\d{3}-\d{2}-\d{2}$/.test(value), "Укажите корректную дату");
  const parsed = new Date(value + "T12:00:00Z");
  check(!Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value, "Укажите корректную дату");
  return value;
};
const link = (value) => {
  const result = text(value, 1500, "Ссылка");
  if (!result) return "";
  try { check(["http:", "https:"].includes(new URL(result).protocol), "Укажите ссылку HTTP или HTTPS"); }
  catch { throw new DomainError("Укажите ссылку HTTP или HTTPS"); }
  return result;
};
const find = (items, id, message = "Запись не найдена") => {
  const result = items.find((item) => item.id === id);
  check(result, message, 404);
  return result;
};

function command(state, payload, context) {
  check(payload && typeof payload === "object" && !Array.isArray(payload), "Некорректная команда");
  const {user, users, now = Date.now(), id = () => crypto.randomUUID()} = context;
  const lead = user.role === "lead";
  const member = (value, required = false) => {
    if (!value && !required) return "";
    return find(users, value, "Исполнитель не найден").id;
  };
  const requireLead = () => check(lead, "Действие доступно руководителю", 403);
  const event = (label, note = "") => ({id: id(), actorId: user.id, at: now, label, note});
  const touch = (task, label, note) => {
    task.history.push(event(label, note));
    task.updatedAt = now;
  };
  const related = (value, records, message) => value ? find(records, value, message).id : "";
  const taskFields = (input, existing) => {
    const market = option(input.market, markets, "площадку");
    const launchId = related(input.launchId, state.launches, "Запуск не найден");
    const productId = related(input.productId, state.products, "Товар не найден");
    if (launchId) {
      const launch = find(state.launches, launchId);
      check(launch.productId === productId, "Выберите товар этого запуска");
    }
    return {
      title: text(input.title, 140, "Название", true),
      note: text(input.note, 4000, "Задача и цель"), market,
      category: option(input.category, categories, "категорию"),
      due: date(input.due), priority: option(input.priority || "normal", priorities, "приоритет"),
      productId, launchId, source: link(input.source),
      result: link(input.result ?? existing?.result),
    };
  };

  if (payload.action === "createTask") {
    const direct = Boolean(payload.direct);
    if (direct) requireLead();
    const task = {...taskFields(payload), id: id(), authorId: user.id,
      assigneeId: direct ? member(payload.assigneeId, true) : "",
      status: direct ? "todo" : "incoming", kind: direct ? "task" : "request", createdAt: now, archived: false, attachments: [], links: [], history: []};
    touch(task, direct ? "Задача назначена" : "Заявка создана");
    state.tasks.unshift(task);
    return task;
  }

  if (["editTask", "transition", "comment", "attachment", "taskLink"].includes(payload.action)) {
    const task = find(state.tasks, payload.id);
    const author = task.authorId === user.id;
    const worker = task.assigneeId === user.id;
    if (["comment", "attachment", "taskLink"].includes(payload.action)) {
      check(!task.archived, "Карточка в архиве", 409);
      check(lead || author || worker, "Действие доступно участникам задачи", 403);
      if (payload.action === "comment") touch(task, "Комментарий", text(payload.comment, 2500, "Комментарий", true));
      else if (payload.action === "taskLink") {
        const url = link(payload.url);
        check(url, "Укажите ссылку");
        const label = text(payload.label, 140, "Подпись");
        task.links ??= [];
        check(task.links.length < 40, "В карточке уже 40 ссылок");
        task.links.push({id: id(), url, label, actorId: user.id});
        touch(task, "Добавлена ссылка", label || url);
      } else {
        check(context.attachment, "Файл не передан");
        check(task.attachments.length < 20, "В карточке уже 20 файлов");
        task.attachments.push(context.attachment);
        touch(task, "Прикреплён файл", context.attachment.name);
      }
    } else if (payload.action === "editTask") {
      check(!task.archived && task.status !== "done" && (lead || (author && requestStatus(task.status))),
        "Редактирование задачи недоступно", 403);
      const fields = taskFields(payload, task);
      if (!lead) fields.priority = task.priority;
      Object.assign(task, fields);
      if (lead && !requestStatus(task.status)) task.assigneeId = member(payload.assigneeId, true);
      touch(task, "Параметры обновлены");
    } else {
      const step = payload.step;
      check(taskActions(task, user).includes(step), "Переход сейчас недоступен", 409);
      const transition = transitions[step];
      const comment = text(payload.comment, 2500, "Комментарий", transition.comment);
      if (step === "approve") {
        task.assigneeId = member(payload.assigneeId, true);
        task.due = date(payload.due);
        task.priority = option(payload.priority, priorities, "приоритет");
      }
      if (step === "verifyStock") {
        const screenshot = task.attachments.find((file) => file.id === payload.attachmentId && file.actorId === user.id &&
          Object.hasOwn(screenshotTypes, file.type || ""));
        check(screenshot, "Прикрепите и выберите скриншот проверки остатков");
        const shortage = payload.shortage === true || payload.shortage === "on";
        check(!shortage || comment, "Укажите, по какому товару не хватает остатков");
        task.stockResult = {shortage, attachmentId: screenshot.id, note: comment, actorId: user.id, at: now};
      }
      if (step === "complete" || step === "accept") {
        if (task.stageKey === "start") {
          const launch = find(state.launches, task.launchId);
          check(state.tasks.filter((item) => item.launchId === launch.id && item.stageKey && item.stageKey !== "start")
            .every((item) => item.status === "done"), "Сначала завершите все этапы подготовки");
          check(Object.keys(approvalTypes).every((key) => launch.approvals[key] === "approved"),
            "Сначала закройте согласования запуска");
        }
      }
      if (step === "undoComplete" && task.stageKey && task.stageKey !== "start") {
        check(!state.tasks.some((item) => item.launchId === task.launchId && item.stageKey === "start" && item.status === "done"),
          "Сначала верните к выполнению финальный запуск");
      }
      if (step === "submit") {
        task.result = link(payload.result);
        check(task.result || task.attachments.some((file) => file.actorId === user.id) || comment,
          "Добавьте ссылку, файл результата или комментарий о выполнении");
      }
      if (step === "archive" || step === "restore") task.archived = step === "archive";
      else task.status = transition.status;
      touch(task, transition.label, comment);
    }
    return task;
  }

  if (payload.action === "product") {
    check(lead || !payload.id || find(state.products, payload.id).ownerId === user.id, "Действие доступно автору или руководителю", 403);
    const fields = {
      title: text(payload.title, 120, "Товар", true), ozonSku: text(payload.ozonSku, 60, "Артикул Ozon"),
      wbSku: text(payload.wbSku, 60, "Артикул Wildberries"), ozonUrl: link(payload.ozonUrl), wbUrl: link(payload.wbUrl),
    };
    check(fields.ozonSku || fields.wbSku, "Укажите хотя бы один артикул");
    check(!state.products.some((item) => item.id !== payload.id &&
      ["ozonSku", "wbSku"].some((key) => fields[key] && item[key].toLowerCase() === fields[key].toLowerCase())),
      "Товар с таким артикулом уже существует", 409);
    if (payload.id) return Object.assign(find(state.products, payload.id), fields);
    const item = {...fields, id: id(), ownerId: user.id};
    state.products.unshift(item);
    return item;
  }

  if (payload.action === "launch") {
    const old = payload.id ? find(state.launches, payload.id) : null;
    check(lead || old?.coordinatorId === user.id, "Действие доступно руководителю или координатору", 403);
    const productId = find(state.products, payload.productId, "Выберите товар").id;
    check(!old || old.productId === productId, "Товар запуска уже закреплён");
    const item = {id: old?.id || id(), productId, title: text(payload.title, 120, "Название запуска", true),
      start: old?.template ? old.start : date(payload.start, !payload.template), supply: date(payload.supply, true),
      coordinatorId: lead ? member(payload.coordinatorId, true) : old.coordinatorId,
      note: text(payload.note, 2500, "Зависимости и сдвиги"),
      approvals: old?.approvals || Object.fromEntries(Object.keys(approvalTypes).map((key) => [key, "pending"])),
    };
    if (old) {
      if (old.template && old.supply !== item.supply) {
        check(!state.tasks.some((task) => task.launchId === old.id && task.stageKey === "start" && task.status === "done"),
          "Чтобы перенести дату, сначала верните финальный этап к выполнению");
        item.start = date(shiftDate(item.supply, old.template.startOffset), true);
        for (const stage of state.tasks.filter((task) => task.launchId === old.id && task.stageKey && task.status !== "done")) {
          stage.due = date(shiftDate(item.supply, stage.stageOffset), true);
          touch(stage, "Срок пересчитан от даты прихода товара");
        }
      } else if (old.template) item.start = old.start;
      return Object.assign(old, item);
    }

    if (payload.template) {
      const market = option(payload.market, markets, "площадку");
      const roles = launchTemplate.map((stage) => {
        const raw = payload["offset_" + stage.key];
        const offset = Number(raw);
        check((typeof raw === "number" || (typeof raw === "string" && /^-?\d+$/.test(raw))) &&
          Number.isInteger(offset) && offset >= -90 && offset <= 90, "Смещение этапа должно быть от −90 до +90 дней");
        return {...stage, offset, assigneeId: member(payload["person_" + stage.key], true)};
      });
      const finalOffset = roles.find((stage) => stage.key === "start").offset;
      check(finalOffset >= 0 && roles.every((stage) => stage.offset <= finalOffset),
        "Старт продаж должен быть в день прихода или позже и после сроков подготовки");
      item.template = {market, startOffset: finalOffset};
      item.start = date(shiftDate(item.supply, finalOffset), true);
      const stages = roles.map((stage) => {
        const task = {id: id(), title: stage.label, note: item.title, market, category: stage.category,
          due: date(shiftDate(item.supply, stage.offset), true), priority: "normal", productId, launchId: item.id,
          stageKey: stage.key, stageOffset: stage.offset, authorId: user.id, assigneeId: stage.assigneeId,
          status: "todo", kind: "task", archived: false, createdAt: now, attachments: [], links: [], history: [], source: "", result: ""};
        touch(task, "Назначено по шаблону запуска");
        return task;
      });
      state.tasks.unshift(...stages);
    }
    state.launches.unshift(item);
    return item;
  }

  if (payload.action === "approval") {
    requireLead();
    const launch = find(state.launches, payload.id);
    if (payload.value === "pending") check(!state.tasks.some((task) => task.launchId === launch.id &&
      task.stageKey === "start" && task.status === "done"), "Сначала верните к выполнению финальный запуск");
    launch.approvals[option(payload.key, approvalTypes, "согласование")] = option(payload.value, approvalStatuses, "статус");
    return launch;
  }

  if (payload.action === "operation") {
    const old = payload.id ? find(state.operations, payload.id) : null;
    check(!old || lead || old.ownerId === user.id, "Запись доступна автору или руководителю", 403);
    const type = option(payload.type, {supply: true, promotion: true}, "тип");
    const productId = related(payload.productId, state.products, "Товар не найден");
    const launchId = related(payload.launchId, state.launches, "Запуск не найден");
    if (launchId) check(find(state.launches, launchId).productId === productId, "Выберите товар этого запуска");
    const fields = {id: old?.id || id(), ownerId: old?.ownerId || user.id, type,
      title: text(payload.title, 140, "Название", true), market: option(payload.market, markets, "площадку"),
      productId, launchId, plannedOut: date(payload.plannedOut), actualOut: date(payload.actualOut),
      plannedIn: date(payload.plannedIn), actualIn: date(payload.actualIn), url: link(payload.url),
      note: text(payload.note, 2500, "Заметка"),
    };
    if (old) return Object.assign(old, fields);
    state.operations.unshift(fields);
    return fields;
  }

  if (payload.action === "schedule") {
    requireLead();
    const old = payload.id ? find(state.schedules, payload.id) : null;
    const stockCheck = payload.stockCheck === "on" || payload.stockCheck === true;
    const frequency = stockCheck ? "daily" : option(payload.frequency, recurringTypes, "расписание");
    const weekdays = {1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 0: true};
    const fields = {
      id: old?.id || id(), authorId: old?.authorId || user.id, title: text(payload.title, 140, "Название", true),
      note: text(payload.note, 4000, "Чек-лист или содержание отчёта"),
      market: option(payload.market, markets, "площадку"), category: option(payload.category, categories, "категорию"),
      assigneeId: member(payload.assigneeId, true), frequency, stockCheck,
      weekday: frequency === "weekly" ? Number(option(String(payload.weekday), weekdays, "день недели")) : 1,
      active: Boolean(payload.active), lastRun: old?.active ? old.lastRun : "",
      createdOn: old?.active ? old.createdOn : context.today,
    };
    if (stockCheck && fields.active) check(!state.schedules.some((item) => item.id !== fields.id &&
      item.stockCheck && item.active && item.market === fields.market && item.assigneeId === fields.assigneeId),
      "Для этого исполнителя и площадки ежедневная проверка уже настроена", 409);
    if (old) return Object.assign(old, fields);
    state.schedules.unshift(fields);
    return fields;
  }

  throw new DomainError("Команда не найдена", 404);
}

function materializeSchedules(state, today, now = Date.now()) {
  let changed = false;
  for (const schedule of state.schedules) {
    if (!schedule.active || schedule.lastRun >= today) continue;
    const from = schedule.lastRun ? shiftDate(schedule.lastRun, 1) : schedule.createdOn;
    for (let day = from > shiftDate(today, -30) ? from : shiftDate(today, -30); day <= today; day = shiftDate(day, 1)) {
      const weekday = new Date(day + "T12:00:00Z").getUTCDay();
      if (schedule.frequency === "weekdays" && (weekday === 0 || weekday === 6)) continue;
      if (schedule.frequency === "weekly" && weekday !== schedule.weekday) continue;
      const id = schedule.id + "-" + day;
      if (state.tasks.some((task) => task.id === id)) continue;
      state.tasks.unshift({id, title: schedule.title, note: schedule.note, market: schedule.market, category: schedule.category,
        due: day, priority: "normal", authorId: schedule.authorId, assigneeId: schedule.assigneeId, status: "todo",
        archived: false, kind: "task", stockCheck: Boolean(schedule.stockCheck), scheduleId: schedule.id, createdAt: now, productId: "", launchId: "", source: "", result: "", attachments: [],
        history: [{id, actorId: schedule.authorId, at: now, label: "Создано по расписанию", note: ""}], updatedAt: now});
    }
    schedule.lastRun = today;
    changed = true;
  }
  return changed;
}

        <button type="button" class="account" ${click("settings")} aria-label="Настройки профиля">
          <span class="avatar">${escape(current.name.slice(0, 1))}</span><span class="account-name">${escape(current.name)}<small>${escape(role(current))}</small></span>${icon("chevron", 15)}
        </button>
      </div>
    </header>
    <main id="main">
      <div class="page-head"><div><h1>${view === "overview" ? "Обзор команды" : display}</h1>
        ${view === "overview" ? '<p class="page-caption">Заявки, задачи и запуски в одном месте</p>' : ""}</div>
        ${button(newLabel, "create", view === "inbox" || !canLead() ? "request" : "", "primary new-task", "plus")}
      </div>
      <div class="demo-banner"><span>Демо с примерами. Изменения действуют до перезагрузки.</span>
        <div class="demo-actions">${button("Сменить роль", "settings", "", "quiet")}${button("Как показать", "guide", "", "quiet")}</div></div>
      ${view !== "stock" ? stockReminder() : ""}
      ${body()}
    </main></div>
    <nav class="bottom-nav" aria-label="Быстрый доступ">${["overview", "inbox", "mine"].map((key) =>
      '<button type="button" class="nav-item ' + (view === key ? "selected" : "") + '" ' + click("nav", key) + '>' + icon(views[key].icon, 19) + '<span>' + ({overview:"Обзор",inbox:"Заявки",mine:"Задачи"})[key] + '</span></button>').join("")}
      <button type="button" class="nav-item ${["overview", "inbox", "mine"].includes(view) ? "" : "selected"}" ${click("mobileMenu")}>${icon("list", 19)}<span>Ещё</span></button>
    </nav>`;
}

function navigate(next, nextFocus = "all") {
  view = next;
  focus = nextFocus;
  market = "all";
  status = "all";
  query = "";
  selectedPerson = "";
  selectedMonth = "";
  if (modal.open) modal.close();
  render();
  window.scrollTo(0, 0);
}

function empty(label, text = "") {
  return '<div class="empty"><span class="empty-icon">' + icon("layers", 24) + '</span><strong>' + escape(label) + '</strong>' +
    (text ? '<p>' + escape(text) + '</p>' : '') + '</div>';
}

function taskRow(task, planner = false) {
  const actions = taskActions(task, current);
  const step = ["undoComplete", "verifyStock", "complete", "accept", "submit"].find((action) => actions.includes(action));
  const checked = task.status === "done";
  const control = planner ? step ?
    '<button type="button" class="row-check ' + (checked ? "checked" : "") + '" ' + click(["complete", "undoComplete"].includes(step) ? "plannerCheck" : "transition", task.id + ":" + step) +
    ' aria-label="' + escape(transitions[step].label + " · " + task.title) + '">' + icon("check", 15) + '</button>' :
    '<span class="row-check ' + (checked ? "checked" : "") + '" role="img" aria-label="' + (checked ? "Выполнено" : "Не выполнено") + '">' + icon("check", 15) + '</span>' : "";
  const sku = state.products.find((item) => item.id === task.productId)?.[task.market === "ozon" ? "ozonSku" : "wbSku"];
  return `${planner ? '<div class="planner-row" data-market="' + marketTone(task.market) + '">' + control : ""}<button type="button" class="task-row" data-market="${marketTone(task.market)}" ${click("task", task.id)}>
    <span class="task-icon ${task.status}">${icon(task.status === "done" ? "check" : requestStatus(task.status) ? "download" : "list", 18)}</span>
    <span class="task-main"><strong>${escape(task.title)}</strong><span class="task-meta">${marketTag(task.market)}<span>${categories[task.category]}</span>${sku ? '<span>Арт. ' + escape(sku) + '</span>' : ''}${task.priority === "high" ? '<span class="priority">Высокий приоритет</span>' : ''}</span>${planner && task.note ? '<span class="task-preview">' + escape(task.note) + '</span>' : ""}</span>
    <span class="task-end">${taskBadge(task)}<span class="task-owner">${escape(userName(requestStatus(task.status) ? task.authorId : task.assigneeId))}</span><span class="due ${isLate(task) ? "late" : ""}">${icon("calendar", 15)} ${task.due === today ? "Сегодня" : escape(stageDate(task.due))}</span></span>
    <span class="task-arrow">${icon("right", 16)}</span>
  </button>${planner ? "</div>" : ""}`;
}

const taskList = (items, message, planner = false) => items.length ? '<div class="task-stack">' + [...items].sort(taskOrder).map((task) => taskRow(task, planner)).join("") + '</div>' : empty(message || "Задач пока нет");

function filterBar({team = false, showStatus = true} = {}) {
  return `<div class="filters">
    <div class="market-tabs" role="group" aria-label="Площадка">${[["all", "Все площадки"], ...Object.entries(markets)].map(([key, label]) =>
      '<button type="button" class="chip ' + key + " " + (market === key ? "active" : "") + '" ' + click("market", key) + ' aria-pressed="' + (market === key) + '">' +
      (key === "all" ? "" : '<span class="market-dot ' + key + '"></span>') + label + '</button>').join("")}</div>
    <div class="filter-inputs">
      <label class="search">${icon("search", 17)}<input type="search" id="query" aria-label="Поиск" placeholder="Поиск" value="${escape(query)}"></label>
      ${showStatus ? select("filter-status", "Статус", {all: "Все статусы", ...statuses}, status, false, true) : ""}
      ${team ? select("filter-person", "Исполнитель", {"": "Вся команда", ...Object.fromEntries(users.map((user) => [user.id, user.name]))}, selectedPerson, false, true) : ""}
    </div>
  </div>`;
}

function relevant() {
  const live = state.tasks.filter((task) => !task.archived);
  if (focus === "marketTasks") return live.filter((task) => taskActive(task) && !requestStatus(task.status) && (canLead() || task.assigneeId === current.id || task.authorId === current.id));
  if (view === "inbox") {
    if (!canLead() || focus === "sent") return live.filter((task) => task.authorId === current.id &&
      (task.kind === "request" || requestStatus(task.status)));
    return live.filter((task) => requestStatus(task.status));
  }
  if (view === "archive") return state.tasks.filter((task) => task.archived && (canLead() || task.authorId === current.id || task.assigneeId === current.id));
  if (focus === "team" && canLead()) return live.filter((task) => !requestStatus(task.status) && (!selectedPerson || task.assigneeId === selectedPerson));
  if (focus !== "all" && canLead()) return overview(state, today)[focus] || live;
  return live.filter((task) => (!requestStatus(task.status) && task.assigneeId === current.id) ||
    (task.status === "review" && task.authorId === current.id));
}

function filterTasks(items) {
  return items.filter((task) => marketMatch(task) && searchTask(task) && (status === "all" || status === task.status));
}

const monthOf = (task) => taskMonth(task) || "undated";
const monthLabel = (key) => key === "undated" ? "Без даты" :
  formatDate(key + "-01", {month: "long", year: "numeric"}).replace(/ г\.?$/, "");
const plannerView = () => view === "mine" || view === "archive";

function monthPicker(items) {
  const month = today.slice(0, 7);
  const keys = [...new Set([month, ...(selectedMonth ? [selectedMonth] : []), ...items.map(monthOf)])].sort((a, b) =>
    a === "undated" ? 1 : b === "undated" ? -1 : b.localeCompare(a));
  return select("filter-month", "Месяц", Object.fromEntries(keys.map((key) => [key, monthLabel(key)])),
    selectedMonth || month, false, true);
}

function refreshRows() {
  const rows = document.querySelector("#filtered-rows");
  if (!rows) return;
  const relevantTasks = relevant();
  const items = filterTasks(relevantTasks);
  const visible = plannerView() ? items.filter((task) => monthOf(task) === (selectedMonth || today.slice(0, 7))) : items;
  rows.innerHTML = taskList(visible, plannerView() ? "За выбранный месяц задач нет" : "По этому фильтру задач нет", plannerView());
  document.querySelector("#result-count").textContent = visible.length;

}

function stockReminder() {
  const tasks = state.tasks.filter((task) => task.stockCheck && taskActive(task) && task.assigneeId === current.id && task.due <= today);
  const dueToday = tasks.filter((task) => task.due === today).length;
  const late = tasks.length - dueToday;
  if (!tasks.length) return "";
  const summary = [dueToday && ("На сегодня: " + dueToday), late && ("пропущено: " + late)].filter(Boolean).join(" · ");
  return '<section class="stock-reminder">' + icon("alert", 21) +
    '<div><strong>Пора проверить остатки</strong><p>' + escape(summary) + '</p></div>' +
    button("Открыть проверки", "nav", "stock", "secondary") + '</section>';
}

function stockPage() {
  const checks = state.tasks.filter((task) => task.stockCheck && !task.archived && (canLead() || task.assigneeId === current.id));
  const waiting = checks.filter((task) => taskActive(task) && task.due <= today);
  const results = checks.filter((task) => task.stockResult).sort((a, b) => b.due.localeCompare(a.due));
  const shortages = results.filter((task) => task.stockResult.shortage && task.due.slice(0, 7) === today.slice(0, 7));
  return '<div class="stock-layout">' +
    section("Ожидают проверки", taskList(waiting, "На сегодня всё проверено", true),
      canLead() ? button("Настроить проверку", "schedulePreset", "stock", "secondary") : "") +
    section("Нехватка в этом месяце", taskList(shortages, "Отметок о нехватке нет", true)) +
    section("Журнал проверок", taskList(results.filter((task) => task.due.slice(0, 7) === today.slice(0, 7)),
      "Подтверждённых проверок за этот месяц нет", true)) + '</div>';
}

function marketOverview() {
  const active = state.tasks.filter((task) => taskActive(task) && !requestStatus(task.status) &&
    monthOf(task) === today.slice(0, 7) && (canLead() || task.assigneeId === current.id || task.authorId === current.id));
  const plural = new Intl.PluralRules("ru");
  const labels = {one: "активная задача", few: "активные задачи", many: "активных задач", other: "активных задач"};
  return '<section class="market-overview" aria-label="Маркетплейсы">' + Object.entries(markets).map(([key, label]) => {
    const items = active.filter((task) => task.market === key);
    const late = items.filter(isLate).length;
    return `<button type="button" class="market-card" data-market="${key}" ${click("marketTasks", key)}>
      <span class="market-emblem" aria-hidden="true">${key === "ozon" ? "O" : "WB"}</span>
      <span class="market-name"><strong>${label}</strong><span>${late ? "Просрочено: " + late : "Очередь задач"}</span></span>
      <span class="market-card-count"><strong>${items.length}</strong><span>${labels[plural.select(items.length)]}</span></span>
      <span class="market-open">${icon("arrow", 19)}</span>
    </button>`;
  }).join("") + '</section>';
}

function overviewPage() {
  const summary = overview(state, today);
  const launchCount = state.launches.filter((launch) => Object.values(launch.approvals).includes("pending")).length;
  if (!canLead()) {
    const active = state.tasks.filter((task) => taskActive(task) && !requestStatus(task.status) &&
      (task.assigneeId === current.id || (task.status === "review" && task.authorId === current.id)));
    return `<div class="summary member-summary">
      ${stat("Мои активные задачи", active.length, "list", "mine", "green")}
      ${stat("Мои заявки", state.tasks.filter((task) => taskActive(task) && task.authorId === current.id && (task.kind === "request" || requestStatus(task.status))).length, "download", "inbox")}
      ${stat("Требуют моей приёмки", summary.reviews.filter((task) => task.authorId === current.id).length, "check", "mine")}
    </div>${marketOverview()}${section("Ближайшие задачи", taskList(active.slice().sort(taskOrder).slice(0, 7)), button("Мои задачи", "nav", "mine", "quiet", "arrow"))}`;
  }
  const urgent = [...new Map([...summary.reviews, ...summary.late, ...summary.requests, ...summary.conflicts].map((task) => [task.id, task])).values()].slice(0, 8);
  return `<div class="summary">
      ${stat("Входящие заявки", summary.requests.length, "download", "inbox", "indigo")}
      ${stat("На проверке", summary.reviews.length, "check", "reviews", "mint")}
      ${stat("Просрочено", summary.late.length, "clock", "late", "warm")}
      ${stat("Запуски под угрозой", summary.launches.length, "alert", "products", "rose")}
    </div>
    ${marketOverview()}
    <div class="overview-grid">
      ${section("Требуют внимания", taskList(urgent, "Нет срочных задач"), button("Очередь команды", "focus", "team", "quiet", "arrow"))}
      <div class="overview-side">
        ${section("Контроль запуска", records(summary.launches.map((launch) => miniLaunch(launch)), "Запусков под угрозой нет"),
          button("Все запуски", "nav", "products", "quiet"))}
        ${section("Согласования и сроки", '<div class="control-list">' +
          button("Конфликты сроков · " + summary.conflicts.length, "focus", "conflicts", "secondary", "clock") +
          button("Запуски с согласованиями · " + launchCount, "nav", "products", "secondary", "check") + '</div>')}
      </div>
    </div>`;
}

function stat(label, value, glyph, target, tone = "") {
  const action = Object.hasOwn(views, target) ? "nav" : "focus";
  return '<button type="button" class="stat ' + tone + '" ' + click(action, target) + '><span class="stat-icon">' +
    icon(glyph, 20) + '</span><span class="stat-value">' + value + '</span><span class="stat-label">' + escape(label) + '</span></button>';
}

function miniLaunch(launch) {
  const risks = launchRisks(launch, state.tasks, state.operations, today);
  const tone = launchTone(launch);
  return '<button type="button" class="record mini-record" data-market="' + tone + '" ' + click("launchDetail", launch.id) +
    '><span class="record-icon">' + icon("spark", 18) + '</span><span class="record-main"><strong>' + escape(launch.title) +
    '</strong><span>' + escape(risks[0] || ("Старт " + stageDate(launch.start))) + '</span></span>' + icon("right", 16) + '</button>';
}

function listPage() {
  const relevantTasks = relevant();
  const matched = filterTasks(relevantTasks);
  const items = plannerView() ? matched.filter((task) => monthOf(task) === (selectedMonth || today.slice(0, 7))) : matched;
  const team = canLead() && view === "mine";
  const choices = view === "inbox" && canLead() ? '<div class="view-tabs">' +
    button("Входящие", "inboxFocus", "all", focus === "all" ? "selected-tab" : "quiet") +
    button("Мои заявки", "inboxFocus", "sent", focus === "sent" ? "selected-tab" : "quiet") + '</div>' : team ? '<div class="view-tabs">' + Object.entries(listFilters).filter(([key]) => key !== "requests").map(([key, label]) =>
    button(key === "all" ? "Моя очередь" : label, "focus", key, focus === key ? "selected-tab" : "quiet")).join("") + '</div>' : "";
  const title = view === "inbox" ? (canLead() && focus !== "sent" ? "Заявки команды" : "Мои заявки") : view === "archive" ? "Архив задач" : focus === "all" ? "Моя очередь" : focus === "marketTasks" ? "Задачи по площадкам" : listFilters[focus];
  return choices + '<section class="panel"><div class="panel-head"><h2>' + title +
    ' <span class="count" id="result-count">' + items.length + '</span></h2>' +
    (plannerView() ? '<div id="month-picker">' + monthPicker(relevantTasks) + '</div>' : "") + '</div>' +
    filterBar({team: team && focus === "team", showStatus: view !== "inbox" || !canLead() || focus === "sent"}) +
    '<div id="filtered-rows">' + taskList(items, view === "inbox" ? "Входящих заявок пока нет" : "За выбранный месяц задач нет", plannerView()) + '</div></section>';
}

function productCard(product) {
  const tags = Object.entries(markets).map(([key]) => {
    const sku = product[key === "ozon" ? "ozonSku" : "wbSku"];
    return sku ? '<span class="product-sku">' + marketTag(key) + '<span>' + escape(sku) + '</span></span>' : "";
  }).join("");
  return '<button type="button" class="record" data-market="' + productTone(product) + '" ' + click("productDetail", product.id) +
    '><span class="record-icon">' + icon("box", 19) + '</span><span class="record-main"><strong>' + escape(product.title) +
    '</strong><span>' + tags + '</span></span>' + icon("right", 17) + '</button>';
}

function productsPage() {
  return '<div class="two-panels">' +
    section("Карточки товаров", records(state.products.map(productCard), "Товаров пока нет"), button("Добавить товар", "product", "", "secondary", "plus")) +
    section("Запуски", records(state.launches.map(miniLaunch), "Запусков пока нет"), canLead() ? button("Новый запуск", "launch", "", "secondary", "plus") : "") + '</div>';
}

function operationCard(item) {
  const note = item.type === "supply" ? "Приёмка " : "Публикация ";
  return '<button type="button" class="record" data-market="' + marketTone(item.market) + '" ' + click("operationDetail", item.id) + '><span class="record-icon">' +
    icon(item.type === "supply" ? "archive" : "arrow", 18) + '</span><span class="record-main"><strong>' + escape(item.title) +
    '</strong><span>' + marketTag(item.market) + escape(note + stageDate(item.actualIn || item.plannedIn)) + '</span></span>' + icon("right", 17) + '</button>';
}

function operationsPage() {
  return '<div class="two-panels">' +
    section("Поставки", records(state.operations.filter((item) => item.type === "supply").map(operationCard), "Поставок пока нет"), button("Добавить поставку", "operation", "supply", "secondary", "plus")) +
    section("Продвижение", records(state.operations.filter((item) => item.type === "promotion").map(operationCard), "Записей о продвижении пока нет"), button("Добавить размещение", "operation", "promotion", "secondary", "plus")) + '</div>';
}

function schedulesPage() {
  return section("Шаблоны", records(state.schedules.map((item) =>
    '<button type="button" class="record" data-market="' + marketTone(item.market) + '" ' + click("schedule", item.id) + '><span class="record-icon">' + icon("calendar", 19) +
    '</span><span class="record-main"><strong>' + escape(item.title) + '</strong><span>' +
    marketTag(item.market) + escape(recurringTypes[item.frequency] + (item.frequency === "weekly" ? " · " + week[item.weekday] : "") + " · " + userName(item.assigneeId)) +
    '</span></span><span class="status ' + (item.active ? "done" : "todo") + '">' + (item.active ? "Активен" : "На паузе") + '</span></button>'),
    "Шаблонов пока нет"), button("Новый шаблон", "schedule", "", "secondary", "plus"));
}

function body() {
  if (view === "overview") return overviewPage();
  if (view === "stock") return stockPage();
  if (view === "products") return productsPage();
  if (view === "operations") return operationsPage();
  if (view === "schedules") return schedulesPage();
  return listPage();
}

function options(items, currentValue) {
  return Object.entries(items).map(([value, label]) =>
    '<option value="' + escape(value) + '"' + (String(currentValue) === value ? ' selected' : '') + '>' + escape(label) + '</option>').join("");
}

function select(name, label, items, value, required = false, filter = false) {
  return '<label class="' + (filter ? 'select-filter' : 'field') + '">' + (filter ? '' : escape(label)) +
    '<select name="' + escape(name) + '" aria-label="' + escape(label) + '"' + (required ? " required" : "") + '>' +
    options(items, value) + '</select>' + (filter ? icon("chevron", 15) : "") + '</label>';
}

function input(name, label, value = "", {type = "text", required = false, max = 140, placeholder = ""} = {}) {
  return '<label class="field">' + escape(label) + '<input name="' + escape(name) + '" type="' + type + '" value="' +
    escape(value) + '" maxlength="' + max + '" placeholder="' + escape(placeholder) + '"' + (required ? " required" : "") +
    (type === "date" ? ' min="1900-01-01" max="9999-12-31"' : "") + '></label>';
}
const area = (name, label, value = "", required = false) => '<label class="field">' + escape(label) + '<textarea name="' + name +
  '" rows="3" maxlength="4000"' + (required ? " required" : "") + '>' + escape(value) + '</textarea></label>';
const pair = (...fields) => '<div class="field-grid">' + fields.join("") + '</div>';
const hidden = (name, value) => '<input type="hidden" name="' + name + '" value="' + escape(value) + '">';
const form = (name, fields, submit = "Сохранить") => '<form data-form="' + name + '">' + fields +
  '<p class="form-error" role="alert" hidden></p><div class="dialog-actions"><button type="submit" class="button primary">' + escape(submit) + '</button></div></form>';
const people = () => ({"": "Выбрать сотрудника", ...Object.fromEntries(users.map((user) => [user.id, user.name + " · " + role(user)]))});
const productOptions = () => ({"": "Выбрать товар", ...Object.fromEntries(state.products.map((item) => [item.id, item.title]))});
const launchOptions = () => ({"": "Без запуска", ...Object.fromEntries(state.launches.map((item) => [item.id, item.title]))});

function open(draw) {
  dialogDraw = draw;
  updateDialog();
  if (!modal.open) modal.showModal();
}
function updateDialog() {
  const {title, content, wide, tone = ""} = dialogDraw();
  modal.dataset.market = tone;
  modal.classList.toggle("wide", Boolean(wide));
  modal.innerHTML = '<div class="dialog-head"><h2 id="modal-title">' + escape(title) + '</h2><button type="button" class="icon-button" ' +
    click("close") + ' aria-label="Закрыть">' + icon("close") + '</button></div><div class="dialog-body">' + content + '</div>';
  modal.scrollTop = 0;
}

function showTask(id) {
  open(() => {
    const task = state.tasks.find((item) => item.id === id);
    const taskProduct = state.products.find((item) => item.id === task.productId);
    const isAuthor = task.authorId === current.id;
    const canEdit = !task.archived && task.status !== "done" && (canLead() || (isAuthor && requestStatus(task.status)));
    const canDiscuss = !task.archived && (canLead() || isAuthor || task.assigneeId === current.id);
    const allowed = taskActions(task, current);
    const activity = [...task.history].reverse().map((event) =>
      '<li><strong>' + escape(event.label) + '</strong><span>' + escape(userName(event.actorId) + " · " +
      new Date(event.at).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})) +
      '</span>' + (event.note ? '<p>' + escape(event.note) + '</p>' : '') + '</li>').join("");
    const files = task.attachments.map((file) => '<li>' +
      (demoFiles.has(file.id) ? button(file.name, "downloadFile", file.id, "quiet demo-file", "download") : escape(file.name)) +
      '<small>' + Math.ceil(file.size / 1024) + ' КБ · ' + escape(userName(file.actorId)) + '</small></li>').join("");
    return {title: task.title, tone: marketTone(task.market), wide: true, content: `
      <div class="detail-badges">${marketTag(task.market)}${taskBadge(task)}${task.archived ? '<span class="status todo">В архиве</span>' : ''}</div>
      <dl class="details">${detail("Автор", userName(task.authorId))}${detail("Исполнитель", userName(task.assigneeId))}

function queueMarkup(assigneeId) {
  const items = assigneeId ? state.tasks.filter((task) => taskActive(task) && task.assigneeId === assigneeId).sort(taskOrder) : [];
  return '<div class="subsection queue"><h3>Загрузка исполнителя</h3><div id="assignee-queue" class="subtle">' + queueContent(assigneeId, items) + '</div></div>';
}

function queueContent(assigneeId, items) {
  if (!assigneeId) return "Выберите исполнителя, чтобы увидеть его активные задачи.";
  if (!items.length) return "Активных задач нет.";
  return '<ul>' + items.map((task) => '<li>' + escape(task.title + " · " + stageDate(task.due)) + '</li>').join("") + '</ul>';
}

function openTransition(id, step) {
  const task = state.tasks.find((item) => item.id === id);
  const next = transitions[step];
  let fields = "";
  if (step === "approve") {
    fields += select("assigneeId", "Исполнитель", people(), task.assigneeId || "", true) +
      pair(input("due", "Срок", task.due || "", {type: "date"}), select("priority", "Приоритет", priorities, task.priority)) + queueMarkup(task.assigneeId);
  }
  if (next.result) fields += input("result", "Ссылка на результат", task.result, {type: "url", max: 1500});
  if (next.comment || next.result || step === "approve" || step === "resubmit") fields += area("comment", next.comment ? "Что нужно исправить или уточнить" : "Комментарий", "", next.comment);
  if (step === "verifyStock") {
    const images = task.attachments.filter((file) => file.actorId === current.id && Object.hasOwn(screenshotTypes, file.type || ""));
    if (!images.length) { showTask(id); taskNotice("Прикрепите скриншот PNG, JPEG или WebP, затем подтвердите проверку."); return; }
    fields += select("attachmentId", "Скриншот остатков", Object.fromEntries(images.map((file) => [file.id, file.name])), images.at(-1).id, true) +
      '<label class="checkbox-field"><input type="checkbox" name="shortage"> Есть нехватка остатков</label>' +
      area("comment", "Комментарий и артикул при нехватке");
  }
  if (!fields) { void mutate({action: "transition", id, step}, () => showTask(id)); return; }
  open(() => ({title: next.label, tone: marketTone(task.market), content: form("transition", hidden("id", id) + hidden("step", step) + fields, next.label)}));
}

function taskNotice(message) {

  modal.querySelector(".dialog-body")?.prepend(notice);
  modal.scrollTop = 0;
}

function errorIn(formElement, message) {
  const node = formElement?.querySelector(".form-error");
  if (node) { node.textContent = message; node.hidden = false; }
  else if (modal.open) taskNotice(message);
  else setToast(message);
}

function mutate(payload, onSuccess, sourceForm) {
  let outcome;
  try {
    const copy = structuredClone(state);
    outcome = command(copy, payload, {user: current, users, today, id: nextId, attachment: payload.demoAttachment});
    materializeSchedules(copy, today);
    state = copy;
  } catch (error) {
    errorIn(sourceForm, error.message);
    return false;
  }
  render();
  if (onSuccess) onSuccess(outcome);
  else if (modal.open) modal.close();
  setToast("Изменения сохранены в демо");
  return true;
}

function uploadFile(id, file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024 || !file.size) {
    setToast("Файл должен быть от 1 байта до 8 МБ");
    return;
  }
  const attachment = {id: nextId(), name: file.name, size: file.size, type: file.type, actorId: current.id};
  const saved = mutate({action: "attachment", id, demoAttachment: attachment}, () => {
    demoFiles.set(attachment.id, file);
    showTask(id);
  });
  if (saved) setToast("Файл прикреплён в демо");
}

function sampleStock(id) {
  const canvas = document.createElement("canvas");
  canvas.width = 620;
  canvas.height = 210;
  const context = canvas.getContext("2d");
  if (!context) { setToast("Пример скриншота недоступен"); return; }
  context.fillStyle = "#fff7fb";
  context.fillRect(0, 0, 620, 210);
  context.fillStyle = "#802b55";
  context.font = "bold 24px sans-serif";
  context.fillText("Демо · Проверка остатков", 25, 45);
  context.fillStyle = "#352b35";
  context.font = "18px sans-serif";
  context.fillText("Артикул       Товар                  Остаток", 25, 96);
  context.fillText("OZ-1842      Швабра                 2 шт.", 25, 137);
  context.fillText("OZ-1843      Насадка                18 шт.", 25, 171);
  canvas.toBlob((blob) => {
    if (blob) uploadFile(id, new File([blob], "demo-ostatki.png", {type: "image/png"}));
  }, "image/png");
}

function downloadFile(id) {
  const file = demoFiles.get(id);
  if (!file) return;
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = file.name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 20_000);
}

  market: (value) => {
    market = value;
    document.querySelectorAll('[data-action="market"]').forEach((item) => {
      const selected = item.dataset.value === value;
      item.classList.toggle("active", selected);
      item.setAttribute("aria-pressed", String(selected));
    });
    refreshRows();
  },
  create: (value) => {
    if (value === "request" || !canLead()) taskEditor();
    else open(() => ({title: "Создать", content: '<div class="dialog-toolbar">' +
      button("Новая заявка", "request", "", "secondary", "plus") + button("Назначить задачу", "direct", "", "primary", "plus") + '</div>'}));
  },
  request: () => taskEditor(),
  direct: () => taskEditor({direct: true}),
  task: showTask,
  taskLink: taskLinkEditor,
  editTask: (value) => taskEditor({task: state.tasks.find((task) => task.id === value)}),
  transition: (value) => openTransition(...value.split(":")),
  plannerCheck: (value) => {
    const [id, step] = value.split(":");
    const isDetail = modal.open;
    void mutate({action: "transition", id, step}, isDetail ? () => updateDialog() : undefined);
  },
  product: (value) => productEditor(state.products.find((item) => item.id === value)),
  productDetail: showProduct,
  requestFor: (value) => taskEditor({preset: {productId: value, market: state.products.find((item) => item.id === value).ozonSku ? "ozon" : "wb"}}),
  launch: (value) => launchEditor(state.launches.find((item) => item.id === value)),
  launchDetail: showLaunch,
  stage: (value) => {
    const item = state.launches.find((launch) => launch.id === value);
    taskEditor({direct: true, preset: {launchId: value, productId: item.productId, due: item.start,
      market: state.products.find((product) => product.id === item.productId).ozonSku ? "ozon" : "wb"}});
  },
  approval: (value) => {
    const [id, key, next] = value.split(":");
    void mutate({action: "approval", id, key, value: next}, () => showLaunch(id));
  },
  operation: (value) => operationEditor(value),
  operationDetail: showOperation,
  operationEdit: (value) => {
    const item = state.operations.find((row) => row.id === value);
    operationEditor(item.type, item);
  },
  schedule: (value) => scheduleEditor(state.schedules.find((item) => item.id === value)),
  schedulePreset: (value) => scheduleEditor(null, value),
};

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (button) handlers[button.dataset.action]?.(button.dataset.value);
});

document.addEventListener("submit", (event) => {
  const formElement = event.target;
  const action = formElement.dataset.form;
  if (!action) return;
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(formElement));
  const next = {
    createTask: (task) => {
      navigate(fields.direct ? "mine" : "inbox", fields.direct ? "team" : "sent");
      if (fields.direct) { selectedMonth = monthOf(task); render(); }
      showTask(task.id);
    },
    editTask: (task) => showTask(task.id),
    transition: (task) => showTask(task.id),
    comment: (task) => showTask(task.id),
    taskLink: (task) => showTask(task.id),
    product: (item) => showProduct(item.id),
    launch: (item) => showLaunch(item.id),
    operation: (item) => showOperation(item.id),
  };
  void mutate({...fields, action}, next[action], formElement);
});

document.addEventListener("input", (event) => {
  const field = event.target;
  if (field.name === "supply" || field.name?.startsWith("offset_")) {
    const date = field.form?.elements.namedItem("supply");
    for (const node of modal.querySelectorAll("[data-stage-date]")) {
      const offset = field.form.elements.namedItem("offset_" + node.dataset.stageDate);
      node.textContent = date?.value && date.validity.valid && offset?.value && offset.validity.valid ? stageDate(shiftDate(date.value, Number(offset.value))) : "—";
    }
  }
  if (event.target.id === "query") {
    query = event.target.value.trim().toLocaleLowerCase("ru");
    refreshRows();
  }
});
document.addEventListener("change", (event) => {
  const input = event.target;
  if (input.name === "market" && modal.contains(input)) modal.dataset.market = marketTone(input.value);
  if (["filter-status", "filter-person", "filter-month"].includes(input.name)) {
    if (input.name === "filter-status") status = input.value;
    if (input.name === "filter-person") selectedPerson = input.value;
    if (input.name === "filter-month") selectedMonth = input.value;
    refreshRows();
  }
  if (input.name === "demo-role") {
    current = users.find((user) => user.id === input.value);
    navigate("overview");
    setToast("Роль изменена");
  }
  if (input.dataset.upload) uploadFile(input.dataset.upload, input.files?.[0]);
  if (input.name === "assigneeId") {
    const queue = modal.querySelector("#assignee-queue");
    if (queue) {
      const tasks = state.tasks.filter((task) => taskActive(task) && task.assigneeId === input.value).sort(taskOrder);
      queue.innerHTML = queueContent(input.value, tasks);
    }
  }
  if (input.name === "launchId" && input.value) {
    const product = input.form?.elements.namedItem("productId");
    if (product) product.value = state.launches.find((item) => item.id === input.value).productId;
  }
});

startDemo();
</script>
</body>
</html>
